services:
  - type: web
    name: mindful-campus
    runtime: docker
    plan: free
    healthCheckPath: /api/healthz
    envVars:
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD_SALT
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mindful-campus-db
          property: connectionString

databases:
  - name: mindful-campus-db
    databaseName: mindful_campus
    user: mindful_campus
    plan: free