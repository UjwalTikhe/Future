services:
  - type: web
    name: mindful-campus
    runtime: docker
    plan: free
    healthCheckPath: /api/healthz
    envVars:
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD_SALT
        generateValue: true
      - key: WEB_ORIGIN
        sync: false